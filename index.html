abel":"Trade-off"},{"id":"TR-003","kind":"TR","title":"One Primary Action over Parity of Options","category":"Ranked trade-off","grade":"seed","consensus":"strong","tags":["hierarchy","cta","emphasis","actions","focus"],"rungClass":"tradeoff","body":"## Ranking\n\n**Each surface commits to one primary action and lets everything else be visibly secondary, even when several stakeholders each want their action treated as equal.**\n\n## Why\n\nParity is how organizations avoid deciding. Two teams each own a button, both buttons ship at the same weight, and nobody has to say which one the surface is for. The result is a screen that asks the user to make the decision the design refused to make. TS-003 (The One-Thing Rule) names the principle; this ranking says what to do when the pressure for parity arrives, because it always arrives.\n\nThe cost accepted is that secondary actions get less use than they would at equal weight, and their owners will notice. That is the point. Emphasis is a fixed budget. Spending it equally means spending none of it.\n\n## How to Spot the Conflict\n\n- Two or more filled, high-contrast buttons compete in the same region.\n- A surface's purpose cannot be stated in one sentence because it serves several masters.\n- A design review produces \"can we make ours stand out too?\" requests.\n- A scope list contains several \"primary\" calls to action for one surface.\n\nCite TR-003, name the one action the surface is for, and demote the rest.\n\n## Exemplars\n\n**Commerce (hosted checkout).** A well-built checkout has one emphasized action: pay. Saving the cart, changing the plan and applying a code are all present and all quiet.\n\n**Platform convention (system alerts).** Platform alert dialogs mark one default action and render the alternatives plainly. The user can read the system's recommendation before reading a word.\n\n**Utilitarian (a single search input).** A search page with one field and one submit has no parity problem to solve. Every other capability is a secondary path.\n\n## When It Flips\n\n- **Consent and ethics:** when two options must be presented neutrally (accepting versus declining tracking, opting in versus out of a contract term), emphasizing one is a dark pattern. Parity wins, and the correct finding is about honesty, not hierarchy.\n- **Genuine forks:** a surface whose whole job is to route people (choose a plan, pick a role) may present equal options, provided the options are truly co-equal and the copy carries the difference.\n- **Destructive defaults:** never make the destructive action the visually primary one just to satisfy this ranking.\n\n## Sources\n\n- Jakob Nielsen, \"10 Usability Heuristics,\" heuristic 8 (aesthetic and minimalist design).\n- Platform human interface guidelines on default buttons in alerts.\n- Enforces TS-003 (The One-Thing Rule); complements TS-010 (Editing vs. Listing).","rung":"tradeoff","rungLabel":"Trade-off"},{"id":"TR-004","kind":"TR","title":"Convention over Expression on High-Stakes, Low-Frequency Tasks","category":"Ranked trade-off","grade":"seed","consensus":"strong","tags":["convention","stakes","register","trust","checkout","forms"],"rungClass":"tradeoff","body":"## Ranking\n\n**On tasks people do rarely and cannot afford to get wrong, follow the convention they already know, even when an expressive treatment would be more distinctive and more on-brand.**\n\n## Why\n\nTS-008 (Type as First Material) and the wider pull toward brand expression reward identity and voice. TS-011 (Convention as the Tasteful Choice) says some surfaces should stop at Coherent. On a payment confirmation, a password reset or a tax form, these collide: the brand team wants the moment to feel like the product, and the user wants it to feel like every other safe version of that task they have seen. TS-009 (Register-Stakes Match) sits on the convention side here: high stakes call for a calm register.\n\nThe ranking sides with convention because the user arrives at these moments anxious and unpracticed. They do the task too rarely to learn a new pattern, and the cost of a mistake is high. A familiar shape lowers the effort of trusting the screen. The cost accepted is a less distinctive moment and a brand voice turned down to quiet. That is the correct place for it.\n\n## How to Spot the Conflict\n\n- A high-stakes flow uses custom controls where platform controls exist.\n- Expressive type, motion or illustration appears on a step where users enter money, credentials or legal consent.\n- The critique would praise character (TS-008) on a surface whose ceiling is Coherent (TS-011).\n- A redesign of a rarely used, high-risk flow is justified by brand consistency alone.\n\nCite TR-004 and grade against the Coherent ceiling.\n\n## Exemplars\n\n**Utilitarian (government service design systems).** Public-service design systems standardize forms, errors and confirmation pages across thousands of services. The pages are plain on purpose; users who file once a year recognize the shape immediately.\n\n**Commerce (checkout).** Widely used checkouts converge on the same shape: summary, payment, one emphasized pay action, clear totals. Distinctiveness lives elsewhere in the store.\n\n**Financial (transfer confirmation).** A money transfer's final step shows amount, recipient and timing in the plainest available form. The brand shows up in the reliability, not the styling.\n\n## When It Flips\n\n- **Frequency:** a high-stakes task done daily (a trader's order ticket, a nurse's charting) becomes practiced. Expert efficiency and earned density can outrank convention there.\n- **Identity surfaces:** onboarding, heroes and the core loop are where expression belongs. TR-004 applies only where stakes are high and frequency is low.\n- **Bad conventions:** a convention that is itself confusing or deceptive is not protected by this ranking. Correctness wins first.\n\n## Sources\n\n- Public-sector service design systems and their guidance on standard form patterns.\n- Jakob Nielsen, \"10 Usability Heuristics,\" heuristic 4 (consistency and standards).\n- Enforces TS-011 (Convention as the Tasteful Choice); bounds TS-008 (Type as First Material); complements TS-009 (Register-Stakes Match).","rung":"tradeoff","rungLabel":"Trade-off"},{"id":"TR-005","kind":"TR","title":"Depth on the Core Interaction over Breadth of Features","category":"Ranked trade-off","grade":"seed","consensus":"heuristic","tags":["scope","polish","core-loop","focus","cut"],"rungClass":"tradeoff","body":"## Ranking\n\n**Spend craft on the one interaction the product exists for until it feels inevitable, before spending it on additional features, even when each additional feature is cheap to build.**\n\n## Why\n\nEvery product has a core interaction: the thing a user does most, or the thing they came for. Its quality sets the user's sense of the whole product. A second feature at 80 percent polish adds less than the core moved from 90 to 99, because the core is touched every session and the feature is touched occasionally.\n\nBreadth is seductive because it is visible on a roadmap and easy to count. Depth is invisible until it is missing. When AI tools make each additional feature cheap, the pull toward breadth gets stronger and this ranking matters more. The scarce resource is no longer the ability to build. It is attention, coherence and the care to finish one thing completely.\n\nThe cost accepted is a shorter feature list and lost deals with users who wanted the missing breadth. A product that holds this ranking will be called limited by the users it turned away. That is the trade, made on purpose.\n\n## How to Spot the Conflict\n\n- A roadmap or scope list adds features while the core interaction still has rough edges, missing states or unfinished motion.\n- The product cannot be described by a single verb.\n- Polish is spread evenly across many surfaces, so no surface feels finished.\n- In scope mode: items classified as competing with the core, and items that sit beside it, both draw on craft budget the core still needs.\n\nCite TR-005, name the core interaction, and defer the items that sit beside it.\n\n## Exemplars\n\n**Consumer platform (early touch phones).** The first generation of multitouch phones shipped without features competitors had, and spent its craft on scrolling, inertia and direct manipulation. The core interaction defined the category.\n\n**Developer-tool craft (speed as the feature).** Issue trackers that compete on speed and keyboard flow invest in latency and the feel of one action over adding new modules.\n\n**Hardware and instruments (focused devices).** Single-purpose instruments and synthesizers ship a narrow feature set with deep, tactile control over it. The constraint is the identity.\n\n## When It Flips\n\n- **Platforms and suites:** when breadth is the value (an all-in-one admin console, an integration platform), the core interaction is coverage itself, and missing breadth blocks the job.\n- **The core is done:** when the core interaction is genuinely finished and verified, breadth is the next lever. The ranking is about order, not prohibition.\n- **Table stakes:** a missing capability that users require to adopt at all (export, sign-in, accessibility) is a floor, not breadth.\n\n## Sources\n\n- Steve Jobs, closing Q&A at Apple's Worldwide Developers Conference, May 1997, on focus as saying no to good ideas (paraphrased).\n- Enables TS-001 (The Inevitability Test); complements TS-005 (Edge Cases as Opportunities) and TS-012 (Direct Manipulation as Material).","rung":"tradeoff","rungLabel":"Trade-off"}],"filters":[{"key":"all","label":"All entries"},{"key":"kind:CR","label":"Craft only · CR"},{"key":"kind:TS","label":"Taste only · TS"},{"key":"kind:TR","label":"Trade-offs only · TR"},{"key":"rung:coherent","label":"Rung · Coherent"},{"key":"rung:characterful","label":"Rung · Characterful"},{"key":"rung:convicted","label":"Rung · Convicted"},{"key":"rung:ceiling","label":"Contextual Fit (ceiling)"}],"craftCount":20,"tasteCount":12,"tradeoffCount":5};
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function md(src){
  const lines=String(src||"").split(/\r?\n/);let html="",inList=false;
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/`(.+?)`/g,"<code>$1</code>");
  for(let line of lines){
    if(/^##\s+/.test(line)){if(inList){html+="</ul>";inList=false}html+="<h2>"+inline(line.replace(/^##\s+/,""))+"</h2>";continue}
    if(/^[-*]\s+/.test(line)){if(!inList){html+="<ul>";inList=true}html+="<li>"+inline(line.replace(/^[-*]\s+/,""))+"</li>";continue}
    if(inList){html+="</ul>";inList=false}
    if(line.trim()==="")continue;
    html+="<p>"+inline(line)+"</p>";
  }
  if(inList)html+="</ul>";return html;
}

const allEntries=DATA.entries;
function cardHtml(e){
  const right = (e.kind==="CR"||e.kind==="TR")
    ? '<span class="grade '+esc(e.grade)+'">'+esc(e.grade)+'</span>'
    : '<span class="kind-dot ts">'+esc(e.category||"taste")+'</span>';
  return '<div class="card '+(e.rungClass||"coherent")+'" data-id="'+esc(e.id)+'" data-kind="'+esc(e.kind)+'" data-rung="'+esc(e.rung)+'" data-t="'+esc((e.id+" "+e.title+" "+(e.tags||[]).join(" ")+" "+(e.category||e.group||"")).toLowerCase())+'">'+
    '<div class="card-top"><span class="card-id">'+esc(e.id)+'</span>'+right+'</div>'+
    '<div class="card-title">'+esc(e.title)+'</div>'+
    '<div class="card-meta">'+
      '<span class="rung-badge '+(e.rungClass||"coherent")+'">'+esc(e.rungLabel)+'</span>'+
      (e.group?'<span class="badge">'+esc(e.group)+'</span>':'')+
      ((e.tags&&e.tags.length)?e.tags.slice(0,2).map(t=>'<span class="badge">'+esc(t)+'</span>').join(""):'')+
    '</div>'+
    '</div>';
}

function buildGrid(){
  const grid=document.getElementById("grid");
  grid.innerHTML=allEntries.map(cardHtml).join("");
  for(const card of grid.querySelectorAll(".card")){
    card.addEventListener("click",()=>{const e=findById(card.dataset.id);if(e)openModal(e)});
  }
}

function buildFilter(){
  const sel=document.getElementById("filter");
  sel.innerHTML=DATA.filters.map(f=>'<option value="'+esc(f.key)+'">'+esc(f.label)+'</option>').join("");
  sel.addEventListener("change",applyFilter);
}

function updateStats(n){document.getElementById("stats").textContent=(n===undefined?allEntries.length:n)+" of "+allEntries.length+" · "+DATA.tasteCount+" taste · "+DATA.craftCount+" craft · "+DATA.tradeoffCount+" trade-offs"}

function applyFilter(){
  const f=document.getElementById("filter").value;
  const q=document.getElementById("search").value.trim().toLowerCase();
  let total=0;
  for(const card of document.querySelectorAll(".card")){
    let m=true;
    if(f.startsWith("kind:")) m = card.dataset.kind===f.slice(5);
    else if(f.startsWith("rung:")) m = card.dataset.rung===f.slice(5);
    if(m && q) m = card.dataset.t.includes(q);
    card.classList.toggle("hidden",!m);if(m)total++;
  }
  document.getElementById("noResults").classList.toggle("show",total===0);
  updateStats(total);
}

function openModal(e){
  document.getElementById("mId").textContent=e.id;
  document.getElementById("mTitle").textContent=e.title;
  const meta=[];
  meta.push('<span class="rung-badge '+(e.rungClass||"coherent")+'">'+esc(e.rungLabel)+'</span>');
  meta.push('<span class="badge">'+(e.kind==="CR"?"Craft · CR":e.kind==="TR"?"Trade-off · TR":"Taste · TS")+'</span>');
  if(e.group)meta.push('<span class="badge">'+esc(e.group)+'</span>');
  if(e.category)meta.push('<span class="badge">'+esc(e.category)+'</span>');
  if(e.grade)meta.push('<span class="grade '+esc(e.grade)+'" style="margin-left:auto">'+esc(e.grade)+'</span>');
  if(e.measurable)meta.push('<span class="tag">measurable: '+esc(e.measurable)+'</span>');
  if(e.consensus)meta.push('<span class="tag">consensus: '+esc(e.consensus)+'</span>');
  document.getElementById("mMeta").innerHTML=meta.join("");
  document.getElementById("mBody").innerHTML=md(e.body);
  document.getElementById("modal").className="modal "+(e.rungClass||"coherent");
  document.getElementById("modalBd").classList.add("open");document.body.style.overflow="hidden";
  if(location.hash!=="#"+e.id)history.replaceState(null,"","#"+e.id);
}
function closeModal(){document.getElementById("modalBd").classList.remove("open");document.body.style.overflow="";if(location.hash)history.replaceState(null,"",location.pathname)}

function findById(id){return allEntries.find(e=>e.id.toLowerCase()===id.toLowerCase())}
function applyHash(){const id=location.hash.slice(1);if(!id){closeModal();return}const e=findById(decodeURIComponent(id));if(e)openModal(e)}

buildFilter();
buildGrid();
updateStats();
document.getElementById("search").addEventListener("input",applyFilter);
document.getElementById("mClose").addEventListener("click",closeModal);
document.getElementById("modalBd").addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
window.addEventListener("hashchange",applyHash);
applyHash();
</script></body></html>
